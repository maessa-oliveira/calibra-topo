name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t calibra-topo .
      - run: |
          docker run -d -p 8000:8000 -e CALIBRA_SECRET=ci --name app calibra-topo
          for i in $(seq 1 20); do curl -fs localhost:8000/saude && exit 0; sleep 1; done
          docker logs app; exit 1
