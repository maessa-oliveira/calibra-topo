{% extends "base.html" %}
{% block titulo %}Cadastro — Calibra Topo{% endblock %}
{% block conteudo %}
<section class="cartao estreito">
  <h1>Criar conta</h1>
  {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" action="/cadastro">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Nome <input name="nome" value="{{ nome or '' }}" required autocomplete="name"></label>
    <label>E-mail <input type="email" name="email" value="{{ email or '' }}" required autocomplete="email"></label>
    <label>Senha <small>(mínimo 8 caracteres)</small> <input type="password" name="senha" minlength="8" required autocomplete="new-password"></label>
    <button class="primario">Criar conta</button>
  </form>
  <p class="nota">Já tem conta? <a href="/entrar">Entrar</a></p>
</section>
{% endblock %}
