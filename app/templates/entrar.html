{% extends "base.html" %}
{% block titulo %}Entrar — Calibra Topo{% endblock %}
{% block conteudo %}
<section class="cartao estreito">
  <h1>Entrar</h1>
  <p class="sub">Controle de aferição de estações totais, receptores GNSS e níveis.</p>
  {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" action="/entrar">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>E-mail <input type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="username"></label>
    <label>Senha <input type="password" name="senha" required autocomplete="current-password"></label>
    <button class="primario">Entrar</button>
  </form>
  <p class="nota">Não tem conta? <a href="/cadastro">Cadastre-se</a></p>
</section>
{% endblock %}
